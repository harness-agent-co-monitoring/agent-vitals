[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-vitals"
dynamic = ["version"]
description = "Section-level read maps, monitoring and decision explanations for LLM agent harnesses, from offline replay or live capture"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "agent-vitals authors" }]
keywords = ["llm", "agents", "interpretability", "attention", "harness", "monitoring", "probes", "llama.cpp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2",
    "pydantic>=2.6",
    "pyarrow>=15",
    "scipy>=1.11",
    "zarr>=3",
    "gguf>=0.17",
    "jinja2>=3.1",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
gpu = ["torch>=2.2"]
gepa = ["gepa>=0.1.4"]
dev = ["agent-vitals[server,gpu,gepa]", "pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/zwycl/agent-vitals"
Documentation = "https://github.com/zwycl/agent-vitals/tree/main/docs"

[project.scripts]
vitals = "vitals.cli:main"

[tool.hatch.version]
path = "vitals/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vitals"]

[tool.hatch.build.targets.sdist]
include = ["vitals", "tests", "docs", "examples", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
